name: CI
on:
  push:
    branches: [Master, develop, 'feature/**']
  pull_request:
    branches: [Master, develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ispcontrol
          POSTGRES_USER: ispcontrol
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ispcontrol -d ispcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/ispcontrol
      DATABASE_USER: ispcontrol
      DATABASE_PASSWORD: local_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests and package
        working-directory: backend
        run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

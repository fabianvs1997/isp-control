services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ispcontrol
      POSTGRES_USER: ispcontrol
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispcontrol -d ispcontrol"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
